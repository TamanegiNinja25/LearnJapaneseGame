name: Release builds

# Push a tag like v0.2.0 (or run manually) to export Windows, Linux and Web builds.
# The Web build can be uploaded to itch.io as an HTML5 game (enable SharedArrayBuffer support).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

permissions:
  contents: write   # needed to create the GitHub release on tag pushes

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -sSL "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The APK is signed with the project's committed debug key (tools/android/debug.keystore,
      # referenced by the Android preset) so every release installs over the previous one.
      - name: Configure Android export (SDK from the runner)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/tools/android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          sed -i 's/^          //' "$HOME/.config/godot/editor_settings-4.7.tres"

      - name: Import project
        run: godot --headless --path game --import

      - name: Export
        run: |
          set -euo pipefail
          mkdir -p build/windows build/linux build/web build/android
          godot --headless --path game --export-release "Windows Desktop" ../build/windows/NihongoNoSekai.exe
          godot --headless --path game --export-release "Linux" ../build/linux/NihongoNoSekai.x86_64
          godot --headless --path game --export-release "Web" ../build/web/index.html
          godot --headless --path game --export-debug "Android" ../build/android/NihongoNoSekai.apk

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/android/*.apk

      - name: Package release files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME}"
          mkdir -p dist
          (cd build/windows && zip -q -r "../../dist/NihongoNoSekai-${V}-windows.zip" .)
          (cd build/linux && zip -q -r "../../dist/NihongoNoSekai-${V}-linux.zip" .)
          (cd build/web && zip -q -r "../../dist/NihongoNoSekai-${V}-web.zip" .)
          cp build/android/NihongoNoSekai.apk "dist/NihongoNoSekai-${V}-android.apk"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 日本語の世界 ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: dist/*
          fail_on_unmatched_files: true
