name: Release builds

# Push a tag like v0.2.0 (or run manually) to export Windows, Linux and Web builds.
# The Web build can be uploaded to itch.io as an HTML5 game (enable SharedArrayBuffer support).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -sSL "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android export (SDK from the runner, debug keystore)
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey             -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          sed -i 's/^          //' "$HOME/.config/godot/editor_settings-4.7.tres"

      - name: Import project
        run: godot --headless --path game --import

      - name: Export
        run: |
          set -euo pipefail
          mkdir -p build/windows build/linux build/web build/android
          godot --headless --path game --export-release "Windows Desktop" ../build/windows/NihongoNoSekai.exe
          godot --headless --path game --export-release "Linux" ../build/linux/NihongoNoSekai.x86_64
          godot --headless --path game --export-release "Web" ../build/web/index.html
          godot --headless --path game --export-debug "Android" ../build/android/NihongoNoSekai.apk

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/android/*.apk
